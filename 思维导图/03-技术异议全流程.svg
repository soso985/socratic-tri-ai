<path d="M240 718 C 240 738, 250 726, 250 742" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#am0)"/>
<path d="M240 718 C 240 738, 570 726, 570 742" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#am0)"/>
<path d="M240 718 C 240 738, 890 726, 890 742" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#am0)"/>
<path d="M240 846 L240 880" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#am0)"/>
<path d="M160 966 L160 1000" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#am0)"/>
<path d="M160 1110 L160 1144" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#am0)"/>
<path d="M160 1254 L160 1288" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#am0)"/>
<path d="M160 1398 L160 1432" fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#am0)"/>
<text x="60" y="1446" font-family="'Microsoft YaHei','微软雅黑',sans-serif" font-size="14" fill="#94A3B8">依据：三 AI 自主项目开发系统 · 总体设计说明书 V1.4　§x.y 为条款编号；判定结果三种情形均须留痕与复核。</text>
</svg>